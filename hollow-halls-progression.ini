; Hollow Halls Progression 1.0.2 - travel back to the Return Beacons you reached in the Hollow Halls.
; Settings are read when the game or server starts.

[Progress]
; Host setting: read by the dedicated server, or by the game when you play alone or host.
; false = Return Beacons stay unlocked for good (default).
; true  = a player's Return Beacons in a Hollow Halls reset once they finish it: when one of
;         the hall's end chests (the warrior, ranger and mage gear at the end) is looted while
;         they are in the hall.
; The host keeps each player's beacons in progress.txt next to this file.
ResetOnBossKill=false

[Messages]
; Client display preference, also used when playing alone or hosting.
; True = show a notice when you reach a Return Beacon or a hall resets.
ShowNotices=True
; Language of the notices and the loading screen. auto = the game's own language (follows a
; change in the game). Or one of: en fr it de es ja ko pl pt ru zh-hans zh-hant tr uk th
Language=auto
